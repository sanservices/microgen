Service:
  name: {{ cookiecutter.root_directory_name }}
  version:
  port: 8080
GRPC:
  name: {{ cookiecutter.root_directory_name }}-grpc
  version:
  port: "50051"
{% if cookiecutter.use_mcp == 'y' %}
MCP:
  name: {{ cookiecutter.root_directory_name }}-mcp
  version:
  port: "8081"
{% endif %}
{% if cookiecutter.use_database == 'y' %}
Database:
  user:
  password:
  host:
  port:
  name:
{% endif %}
{% if cookiecutter.use_cache == 'y' %}
Cache:
  enabled:
  expiration_minutes:
  purge_minutes:
  Redis:
    addr:
    password:
    db:
{% endif %}
{% if cookiecutter.use_kafka == 'y' %}
Kafka:
  enabled:
  version:
  consume_only:
  consumer_group_id:
  schema_registration:
  brokers:
  TLS:
    ca_cert_pem:
    cert_pem:
    key_pem:
    skip_verify:
    timeout_secs:
{% endif %}